spring.application.name=portfolio-backend

# --- Server ---
server.port=${PORT:8080}

# --- Database ---
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/portfolio}
spring.datasource.username=${DB_USERNAME:shivam}
spring.datasource.password=${DB_PASSWORD:shivam}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- JWT ---
jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-key-at-least-256-bits}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- Default Admin ---
admin.default-username=${ADMIN_USERNAME:admin}
admin.default-email=${ADMIN_EMAIL:admin@portfolio.local}
admin.default-password=${ADMIN_PASSWORD:Admin@123}